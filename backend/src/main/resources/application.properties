# Database connection
spring.datasource.url=jdbc:postgresql://localhost:5432/rmtutoring
spring.datasource.username=ronitmalhotra
spring.datasource.password=

# Tell Spring Boot to auto-create tables from your model classes
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in the console so you can see what's happening
spring.jpa.show-sql=true

# Tell Spring Boot we're using PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Run on port 8080
server.port=8080